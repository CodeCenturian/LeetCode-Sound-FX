<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 280px;
      padding: 16px;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    h2 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #ffffff;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
    .field { margin-top: 14px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #aaa;
      margin-bottom: 6px;
    }
    input[type="file"] {
      display: block;
      width: 100%;
      font-size: 12px;
      color: #ccc;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 5px;
      cursor: pointer;
    }
    input[type="file"]::file-selector-button {
      background: #333;
      color: #ccc;
      border: none;
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }
    button {
      margin-top: 6px;
      padding: 5px 12px;
      background: #2d6a4f;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: #3a8a65; }
    .status {
      margin-top: 12px;
      font-size: 12px;
      min-height: 16px;
      border-radius: 4px;
      padding: 4px 8px;
      display: none;
    }
    .status.visible { display: block; }
    .status.ok  { background: #1b4332; color: #6fcf97; }
    .status.err { background: #4a1c1c; color: #eb5757; }
  </style>
</head>
<body>
  <h2>LeetCode Sound FX</h2>

  <div class="field">
    <label>Correct Submission Sound</label>
    <input type="file" id="correctFile" accept="audio/*" />
    <button data-type="correct">Save</button>
  </div>

  <div class="field">
    <label>Wrong Submission Sound</label>
    <input type="file" id="wrongFile" accept="audio/*" />
    <button data-type="wrong">Save</button>
  </div>

  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
